{% extends 'base.html' %}

{% block title %}Assinatura - Safira MusiCloud{% endblock %}

{% block content %}
<div class="breadcrumb-path">
    <a href="{{ url_for('main.menu') }}">Menu</a> > <span>Assinatura de Presença</span>
</div>

<div class="filter-bar mb-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar por aluno, professor ou data (AAAA-MM-DD)...">
        <button class="btn btn-outline-primary" type="button" id="filterBtn">
            <i class="fas fa-filter me-1"></i> Filtrar
        </button>
    </div>
</div>

<div class="d-flex justify-content-start mb-2">
    <button class="btn-insert" onclick="openModal('addModal')">
        Inserir
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="dataTable">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 5%;"></th>
                        <th style="width: 15%;">Data</th>
                        <th style="width: 25%;">Aluno</th>
                        <th style="width: 25%;">Professor / Curso</th>
                        <th style="width: 15%;">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS carregar dados -->
                </tbody>
            </table>
        </div>
        <div class="pagination-container" id="pagination"></div>
    </div>
</div>

<!-- Modal Adicionar -->
<div id="addModal" class="modal-custom">
    <div class="modal-content-custom" style="width: 500px;">
        <div class="modal-header-custom">
            <h5>REGISTRAR PRESENÇA</h5>
            <span class="close-custom" onclick="closeModal('addModal')">&times;</span>
        </div>
        <div class="modal-body-custom">
            <form action="{{ url_for('main.add_attendance') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">ALUNO</label>
                    <select name="student_id" class="form-select" required>
                        <option value="">SELECIONE UM ALUNO...</option>
                        {% for student in students %}
                        <option value="{{ student.id }}">{{ student.nome.upper() }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">HORÁRIO DA AGENDA (PROFESSOR / CURSO)</label>
                    <select name="schedule_id" class="form-select" required>
                        <option value="">SELECIONE O HORÁRIO...</option>
                        {% for s in schedules %}
                        <option value="{{ s.id }}">{{ s.nome_professor.upper() }} - {{ s.nome_curso.upper() }} ({{ s.dia_semana.upper() }} {{ s.hora_inicio }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">DATA</label>
                        <input type="date" name="date" class="form-control" required value="{{ today_date }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">STATUS</label>
                        <select name="status" class="form-select" required>
                            <option value="presente">PRESENTE</option>
                            <option value="ausente">AUSENTE</option>
                        </select>
                    </div>
                </div>
                <div class="text-end mt-4 mb-2">
                    <button type="button" class="btn btn-secondary me-2" onclick="closeModal('addModal')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary">SALVAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Confirm Delete -->
<div id="deleteConfirmModal" class="modal-custom">
    <div class="modal-content-custom" style="width: 400px; text-align: center;">
        <div class="modal-header-custom justify-content-center"><h5 class="text-danger">CONFIRMAR EXCLUSÃO</h5></div>
        <div class="modal-body-custom py-4"><p>DESEJA EXCLUIR ESTE REGISTRO DE PRESENÇA?</p></div>
        <div class="d-flex justify-content-center gap-3 mt-3 mb-2">
            <button type="button" class="btn btn-secondary" onclick="closeModal('deleteConfirmModal')">CANCELAR</button>
            <a id="confirmDeleteBtn" href="#" class="btn btn-danger">EXCLUIR</a>
        </div>
    </div>
</div>

<script>
    const allData = [
        {% for a in attendances %}
        {
            id: "{{ a.id }}",
            nome_aluno: "{{ a.nome_aluno.replace('"', '\\"') }}",
            nome_professor: "{{ a.nome_professor.replace('"', '\\"') }}",
            nome_curso: "{{ (a.nome_curso or '').replace('"', '\\"') }}",
            data: "{{ a.data }}",
            status: "{{ a.status }}"
        },
        {% endfor %}
    ];

    let filteredData = [];
    const itemsPerPage = 10;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">Clique em 'Filtrar' para carregar os dados.</td></tr>`;
            return;
        }
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach((a, index) => {
            const statusClass = a.status === 'presente' ? 'bg-success' : 'bg-danger';
            const row = `
                <tr class="fade-in">
                    <td class="ps-4 align-middle">
                        <button class="btn btn-link text-danger p-0 border-0" onclick="confirmDelete('${a.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                    <td class="align-middle">${a.data}</td>
                    <td class="align-middle"><strong>${a.nome_aluno.toUpperCase()}</strong></td>
                    <td class="align-middle text-muted">${a.nome_professor.toUpperCase()}<br><small>${a.nome_curso.toUpperCase()}</small></td>
                    <td class="align-middle"><span class="badge ${statusClass}">${a.status.toUpperCase()}</span></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if (totalPages <= 1) return;
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'} me-1`;
            btn.onclick = () => { currentPage = i; renderTable(); };
            container.appendChild(btn);
        }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        filteredData = allData.filter(item =>
            item.nome_aluno.toLowerCase().includes(term) ||
            item.nome_professor.toLowerCase().includes(term) ||
            item.data.includes(term)
        );
        currentPage = 1;
        renderTable();
    });

    function openModal(id) { document.getElementById(id).style.display = "block"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    function confirmDelete(id) {
        document.getElementById('confirmDeleteBtn').href = "/presenca/deletar/" + id;
        openModal('deleteConfirmModal');
    }

    document.addEventListener('DOMContentLoaded', renderTable);
</script>

<style>
    .modal-custom { display: none; position: fixed; z-index: 1050; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content-custom { background-color: var(--modal-bg); color: var(--text-dark); margin: 5% auto; padding: 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-header-custom { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
    .close-custom { font-size: 28px; font-weight: bold; cursor: pointer; }
</style>
{% endblock %}
